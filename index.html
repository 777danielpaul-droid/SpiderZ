<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpiderZ</title>
    <script>
      // Vor dem ersten Paint: Browser-Restoration aus + hart auf 0.
      // (Im React-Effect wuerde scrollTo(0,0) einen scroll-Event feuern
      //  und das SpiderZ-Reveal beim Reload ausloesen.)
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      window.scrollTo(0, 0);
    </script>
  </head>
  <body>
    <canvas class="starfield" id="starfield" aria-hidden="true"></canvas>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
